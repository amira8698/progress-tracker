<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الأهداف والتقدم | Our Goals</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2b3674;
            --text-muted: #707ebe;
            --border-color: #e9edf7;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .person-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .person-card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .person-name {
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Specific Colors */
        .card-amira .avatar { background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%); }
        .card-hagar .avatar { background: linear-gradient(135deg, #FFC56C 0%, #FF9800 100%); }
        .card-ebtehal .avatar { background: linear-gradient(135deg, #05CD99 0%, #01B574 100%); }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .skill-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #edf2f7;
        }

        .skill-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .skill-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .skill-percentage {
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(112, 144, 176, 0.1);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.6s ease;
        }

        .card-amira .progress-bar-fill { background: linear-gradient(90deg, #868CFF, #4318FF); }
        .card-hagar .progress-bar-fill { background: linear-gradient(90deg, #FFC56C, #FF9800); }
        .card-ebtehal .progress-bar-fill { background: linear-gradient(90deg, #05CD99, #01B574); }

        .add-skill-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
        }

        .add-skill-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .controls input[type="number"] {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .controls button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            background: #2b3674;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 لوحة متابعة الأهداف والتقدم (Our Goals)</h1>
        <p>متابعة التطور والمهارات لكل من أميرة، هاجر، وابتهال</p>
    </div>

    <div class="dashboard-grid">

        <div class="person-card card-amira">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">أمـ</div>
                    <div class="person-name">أميرة (Amira)</div>
                </div>
            </div>

            <div class="skills-list" id="amira-skills">
                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">🌐 English</span>
                        <span class="skill-percentage" id="val-amira-1">20%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-amira-1" style="width: 20%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="20" id="input-amira-1">
                        <button onclick="updateProgress('amira-1')">تحديث</button>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">🐍 Python</span>
                        <span class="skill-percentage" id="val-amira-2">15%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-amira-2" style="width: 15%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="15" id="input-amira-2">
                        <button onclick="updateProgress('amira-2')">تحديث</button>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">💻 Bash Script</span>
                        <span class="skill-percentage" id="val-amira-3">70%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-amira-3" style="width: 70%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="70" id="input-amira-3">
                        <button onclick="updateProgress('amira-3')">تحديث</button>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">☁️ Azure</span>
                        <span class="skill-percentage" id="val-amira-4">40%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-amira-4" style="width: 40%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="40" id="input-amira-4">
                        <button onclick="updateProgress('amira-4')">تحديث</button>
                    </div>
                </div>
            </div>
            <button class="add-skill-btn" onclick="addNewSkill('amira-skills')">+ إضافة مادة / هدف جديد</button>
        </div>

        <div class="person-card card-hagar">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">هـ</div>
                    <div class="person-name">هاجر (Hagar)</div>
                </div>
            </div>

            <div class="skills-list" id="hagar-skills">
                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">🌐 English</span>
                        <span class="skill-percentage" id="val-hagar-1">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-hagar-1" style="width: 0%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="0" id="input-hagar-1">
                        <button onclick="updateProgress('hagar-1')">تحديث</button>
                    </div>
                </div>
            </div>
            <button class="add-skill-btn" onclick="addNewSkill('hagar-skills')">+ إضافة مادة / هدف جديد</button>
        </div>

        <div class="person-card card-ebtehal">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">ابـ</div>
                    <div class="person-name">ابتهال (Ebtehal)</div>
                </div>
            </div>

            <div class="skills-list" id="ebtehal-skills">
                <div class="skill-item">
                    <div class="skill-top">
                        <span class="skill-title">🌐 English</span>
                        <span class="skill-percentage" id="val-ebtehal-1">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-ebtehal-1" style="width: 0%;"></div>
                    </div>
                    <div class="controls">
                        <input type="number" min="0" max="100" value="0" id="input-ebtehal-1">
                        <button onclick="updateProgress('ebtehal-1')">تحديث</button>
                    </div>
                </div>
            </div>
            <button class="add-skill-btn" onclick="addNewSkill('ebtehal-skills')">+ إضافة مادة / هدف جديد</button>
        </div>

    </div>

    <script>
        function updateProgress(id) {
            const input = document.getElementById(`input-${id}`);
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            
            input.value = val;
            document.getElementById(`val-${id}`).innerText = val + '%';
            document.getElementById(`bar-${id}`).style.width = val + '%';
        }

        let counter = 100;
        function addNewSkill(containerId) {
            const title = prompt("أدخل اسم المادة أو الهدف الجديد:");
            if (!title) return;
            
            const initialVal = prompt("أدخل نسبة التقدم الحالية (0-100):", "0") || "0";
            const id = `custom-${counter++}`;

            const container = document.getElementById(containerId);
            const newItem = document.createElement('div');
            newItem.className = 'skill-item';
            newItem.innerHTML = `
                <div class="skill-top">
                    <span class="skill-title">📌 ${title}</span>
                    <span class="skill-percentage" id="val-${id}">${initialVal}%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar-${id}" style="width: ${initialVal}%;"></div>
                </div>
                <div class="controls">
                    <input type="number" min="0" max="100" value="${initialVal}" id="input-${id}">
                    <button onclick="updateProgress('${id}')">تحديث</button>
                </div>
            `;
            container.appendChild(newItem);
        }
    </script>
</body>
</html>
