<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الأهداف والتقدم | Our Goals</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2b3674;
            --text-muted: #707ebe;
            --border-color: #e9edf7;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .person-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .person-card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .person-name {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card-amira .avatar { background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%); }
        .card-hagar .avatar { background: linear-gradient(135deg, #FFC56C 0%, #FF9800 100%); }
        .card-ebtehal .avatar { background: linear-gradient(135deg, #05CD99 0%, #01B574 100%); }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .skill-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #edf2f7;
            position: relative;
        }

        .skill-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .skill-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .skill-percentage {
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(112, 144, 176, 0.1);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.6s ease;
        }

        .card-amira .progress-bar-fill { background: linear-gradient(90deg, #868CFF, #4318FF); }
        .card-hagar .progress-bar-fill { background: linear-gradient(90deg, #FFC56C, #FF9800); }
        .card-ebtehal .progress-bar-fill { background: linear-gradient(90deg, #05CD99, #01B574); }

        .add-skill-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
        }

        .add-skill-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .controls input[type="number"] {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .controls button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            background: #2b3674;
            color: white;
            cursor: pointer;
        }

        .delete-btn {
            background: #e53e3e !important;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 لوحة متابعة الأهداف والتقدم (Our Goals)</h1>
        <p>متابعة التطور والمهارات لكل من أميرة، هاجر، وابتهال</p>
    </div>

    <div class="dashboard-grid">

        <!-- Amira -->
        <div class="person-card card-amira">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">أمـ</div>
                    <div class="person-name">أميرة (Amira)</div>
                </div>
            </div>
            <div class="skills-list" id="amira"></div>
            <button class="add-skill-btn" onclick="addNewSkill('amira')">+ إضافة مادة / هدف جديد</button>
        </div>

        <!-- Hagar -->
        <div class="person-card card-hagar">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">هـ</div>
                    <div class="person-name">هاجر (Hagar)</div>
                </div>
            </div>
            <div class="skills-list" id="hagar"></div>
            <button class="add-skill-btn" onclick="addNewSkill('hagar')">+ إضافة مادة / هدف جديد</button>
        </div>

        <!-- Ebtehal -->
        <div class="person-card card-ebtehal">
            <div class="card-header">
                <div class="person-info">
                    <div class="avatar">ابـ</div>
                    <div class="person-name">ابتهال (Ebtehal)</div>
                </div>
            </div>
            <div class="skills-list" id="ebtehal"></div>
            <button class="add-skill-btn" onclick="addNewSkill('ebtehal')">+ إضافة مادة / هدف جديد</button>
        </div>

    </div>

    <script>
        const initialData = {
            amira: [
                { id: 'amira-1', title: '🌐 English', progress: 20 },
                { id: 'amira-2', title: '🐍 Python', progress: 15 },
                { id: 'amira-3', title: '💻 Bash Script', progress: 70 },
                { id: 'amira-4', title: '☁️ Azure', progress: 40 }
            ],
            hagar: [
                { id: 'hagar-1', title: '🌐 English', progress: 0 }
            ],
            ebtehal: [
                { id: 'ebtehal-1', title: '🌐 English', progress: 0 }
            ]
        };

        function getData() {
            const saved = localStorage.getItem('our_goals_data');
            return saved ? JSON.parse(saved) : initialData;
        }

        function saveData(data) {
            localStorage.setItem('our_goals_data', JSON.stringify(data));
        }

        function render() {
            const data = getData();
            ['amira', 'hagar', 'ebtehal'].forEach(person => {
                const container = document.getElementById(person);
                container.innerHTML = '';
                
                data[person].forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = 'skill-item';
                    el.innerHTML = `
                        <div class="skill-top">
                            <span class="skill-title">${item.title}</span>
                            <span class="skill-percentage">${item.progress}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${item.progress}%;"></div>
                        </div>
                        <div class="controls">
                            <input type="number" min="0" max="100" value="${item.progress}" id="input-${person}-${index}">
                            <button onclick="updateProgress('${person}', ${index})">تحديث</button>
                            <button class="delete-btn" onclick="deleteSkill('${person}', ${index})">حذف</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
            });
        }

        function updateProgress(person, index) {
            const data = getData();
            const input = document.getElementById(`input-${person}-${index}`);
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            
            data[person][index].progress = val;
            saveData(data);
            render();
        }

        function addNewSkill(person) {
            const title = prompt("أدخل اسم المادة أو الهدف الجديد:");
            if (!title) return;
            const progress = parseInt(prompt("أدخل نسبة التقدم الحالية (0-100):", "0")) || 0;

            const data = getData();
            data[person].push({
                id: `${person}-${Date.now()}`,
                title: `📌 ${title}`,
                progress: progress > 100 ? 100 : (progress < 0 ? 0 : progress)
            });
            
            saveData(data);
            render();
        }

        function deleteSkill(person, index) {
            if (confirm("هل انت متأكد من حذف هذه المادة؟")) {
                const data = getData();
                data[person].splice(index, 1);
                saveData(data);
                render();
            }
        }

        // Initial Load
        render();
    </script>
</body>
</html>
